<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="clientBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3fbef"/>
      <stop offset="100%" stop-color="#e6f4df"/>
    </linearGradient>
    <linearGradient id="gatewayBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff6e8"/>
      <stop offset="100%" stop-color="#fde8c9"/>
    </linearGradient>
    <linearGradient id="serverBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#dce9ff"/>
    </linearGradient>
    <linearGradient id="hardwareBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f1ff"/>
      <stop offset="100%" stop-color="#ece1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f1515" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#201515"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ff4f00"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 36px; font-weight: 800; fill: #111; }
      .section { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 28px; font-weight: 800; }
      .boxTitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #201515; }
      .body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; fill: #302626; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #605d52; }
      .code { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 16px; fill: #201515; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #201515; }
      .whiteTitle { fill: #fffefb; }
      .whiteBody { fill: #f1e8e2; }
      .arrow { stroke: #201515; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrowOrange { stroke: #ff4f00; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke: #201515; stroke-width: 2.2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fffefb"/>
  <text x="800" y="50" text-anchor="middle" class="title">YogaTutor B/S 架构下网页功能实现路径图</text>
  <text x="800" y="82" text-anchor="middle" class="small">浏览器采集与展示，本机 Python 服务计算，ESP32 左手环输出触觉方向</text>

  <!-- Client -->
  <rect x="28" y="110" width="360" height="600" rx="18" fill="url(#clientBg)" stroke="#5a8c4d" stroke-width="3" filter="url(#shadow)"/>
  <text x="208" y="158" text-anchor="middle" class="section" fill="#2f642b">客户端</text>

  <rect x="58" y="190" width="300" height="176" rx="12" fill="#fafff8" stroke="#5a8c4d" stroke-width="2"/>
  <text x="208" y="224" text-anchor="middle" class="boxTitle">浏览器前端</text>
  <text x="208" y="250" text-anchor="middle" class="code">web/index.html + app.js</text>
  <text x="82" y="286" class="body">摄像头权限与画面显示</text>
  <text x="82" y="316" class="body">Canvas 截帧并压缩 JPEG</text>
  <text x="82" y="346" class="body">按钮：开启摄像头 / 重新评估</text>

  <rect x="58" y="400" width="300" height="206" rx="12" fill="#fafff8" stroke="#5a8c4d" stroke-width="2"/>
  <text x="208" y="435" text-anchor="middle" class="boxTitle">网页功能区</text>
  <text x="82" y="474" class="body">目标姿势：Warrior II</text>
  <text x="82" y="506" class="body">实时画面与骨架叠加</text>
  <text x="82" y="538" class="body">评分条与关节偏差列表</text>
  <text x="82" y="570" class="body">左手环方向与 USB 状态</text>

  <!-- Gateway -->
  <rect x="548" y="170" width="310" height="430" rx="16" fill="url(#gatewayBg)" stroke="#dd8a2b" stroke-width="3" filter="url(#shadow)"/>
  <text x="703" y="222" text-anchor="middle" class="section" fill="#aa5b1d">本机 HTTP 服务</text>
  <text x="703" y="260" text-anchor="middle" class="code">src/web_mvp_server.py</text>
  <text x="703" y="302" text-anchor="middle" class="boxTitle">ThreadingHTTPServer</text>

  <rect x="588" y="335" width="230" height="46" rx="8" fill="#fffefb" stroke="#dd8a2b" stroke-width="1.6"/>
  <text x="703" y="364" text-anchor="middle" class="code">GET /api/status</text>
  <rect x="588" y="397" width="230" height="46" rx="8" fill="#fffefb" stroke="#dd8a2b" stroke-width="1.6"/>
  <text x="703" y="426" text-anchor="middle" class="code">POST /api/frame</text>
  <rect x="588" y="459" width="230" height="46" rx="8" fill="#fffefb" stroke="#dd8a2b" stroke-width="1.6"/>
  <text x="703" y="488" text-anchor="middle" class="code">POST /api/reset</text>
  <text x="703" y="545" text-anchor="middle" class="body">当前传输：image/jpeg 帧</text>
  <text x="703" y="574" text-anchor="middle" class="small">localhost HTTP，本机演示闭环</text>

  <!-- Server -->
  <rect x="930" y="110" width="632" height="600" rx="18" fill="url(#serverBg)" stroke="#3b69c8" stroke-width="3" filter="url(#shadow)"/>
  <text x="1246" y="158" text-anchor="middle" class="section" fill="#2556b5">服务器 / 计算层</text>

  <rect x="1018" y="188" width="456" height="94" rx="12" fill="#edf4ff" stroke="#3b69c8" stroke-width="2"/>
  <text x="1246" y="224" text-anchor="middle" class="boxTitle">WarriorIISession</text>
  <text x="1246" y="254" text-anchor="middle" class="body">统一管理识别、评分、状态返回和触觉输出</text>

  <rect x="970" y="322" width="242" height="292" rx="14" fill="#fff7da" stroke="#d5a329" stroke-width="2"/>
  <text x="1091" y="354" text-anchor="middle" class="boxTitle">视觉计算路径</text>
  <rect x="1002" y="378" width="178" height="34" rx="7" fill="#fffefb" stroke="#d5a329"/>
  <text x="1091" y="401" text-anchor="middle" class="code">cv2.imdecode</text>
  <rect x="1002" y="424" width="178" height="34" rx="7" fill="#fffefb" stroke="#d5a329"/>
  <text x="1091" y="447" text-anchor="middle" class="code">PoseDetector</text>
  <rect x="1002" y="470" width="178" height="34" rx="7" fill="#fffefb" stroke="#d5a329"/>
  <text x="1091" y="493" text-anchor="middle" class="code">MultiPointFilter</text>
  <rect x="1002" y="516" width="178" height="34" rx="7" fill="#fffefb" stroke="#d5a329"/>
  <text x="1091" y="539" text-anchor="middle" class="code">StillnessDetector</text>
  <rect x="1002" y="562" width="178" height="34" rx="7" fill="#fffefb" stroke="#d5a329"/>
  <text x="1091" y="585" text-anchor="middle" class="code">PoseComparator</text>

  <rect x="1270" y="322" width="242" height="292" rx="14" fill="url(#hardwareBg)" stroke="#7b55aa" stroke-width="2"/>
  <text x="1391" y="354" text-anchor="middle" class="boxTitle" fill="#57308f">触觉控制路径</text>
  <rect x="1302" y="386" width="178" height="42" rx="8" fill="#fffefb" stroke="#7b55aa"/>
  <text x="1391" y="413" text-anchor="middle" class="code">HapticMapper</text>
  <rect x="1302" y="450" width="178" height="42" rx="8" fill="#fffefb" stroke="#7b55aa"/>
  <text x="1391" y="477" text-anchor="middle" class="code">ESP32Controller</text>
  <rect x="1302" y="514" width="178" height="72" rx="8" fill="#fffefb" stroke="#7b55aa"/>
  <text x="1391" y="543" text-anchor="middle" class="body">串口命令</text>
  <text x="1391" y="570" text-anchor="middle" class="code">L:2,150 R:N</text>

  <!-- Hardware layer -->
  <rect x="1018" y="650" width="456" height="42" rx="10" fill="#edf4ff" stroke="#3b69c8" stroke-width="2"/>
  <text x="1246" y="677" text-anchor="middle" class="body">标准数据：src/standard_poses/Warrior II Pose.json</text>

  <rect x="1040" y="742" width="452" height="126" rx="16" fill="#201515" stroke="#201515" stroke-width="2" filter="url(#shadow)"/>
  <text x="1266" y="778" text-anchor="middle" class="boxTitle whiteTitle">ESP32 左手环硬件</text>
  <text x="1090" y="814" class="body whiteBody">固件：firmware/yoga_bands/yoga_bands.ino</text>
  <text x="1090" y="842" class="body whiteBody">M0 下，M1 左，M2 上，M3 右</text>
  <text x="1090" y="866" class="body whiteBody">2 秒无命令自动停震</text>

  <!-- Arrows -->
  <path class="arrow" d="M358 278 L548 278"/>
  <text x="452" y="258" text-anchor="middle" class="label">HTTP 请求 / JSON</text>
  <text x="452" y="302" text-anchor="middle" class="label">JPEG 帧上传</text>

  <path class="arrow" d="M858 358 L1018 235"/>
  <text x="920" y="275" text-anchor="middle" class="label">路由到会话</text>

  <path class="arrow" d="M1246 282 L1246 322"/>
  <path class="arrow" d="M1212 468 L1270 468"/>
  <text x="1240" y="448" text-anchor="middle" class="label">最大偏差</text>

  <path class="arrowOrange" d="M1391 614 L1391 742"/>
  <text x="1445" y="690" class="label" fill="#ff4f00">USB Serial</text>

  <path class="dash" d="M1040 742 C790 790 430 790 210 710 L210 606"/>
  <text x="520" y="742" text-anchor="middle" class="label">JSON 响应：state / score / joints / guidance / landmarks</text>

  <path class="arrowOrange" d="M548 542 C438 650 340 662 230 606"/>
  <text x="383" y="646" text-anchor="middle" class="label" fill="#ff4f00">页面更新评分、关节偏差、手环方向</text>

  <!-- Notes -->
  <rect x="420" y="762" width="520" height="104" rx="14" fill="#ffe4d6" stroke="#ffb38a" stroke-width="2"/>
  <text x="450" y="798" class="boxTitle" fill="#ff4f00">部署边界</text>
  <text x="450" y="830" class="body">当前：同一台电脑作为客户端和服务器，访问 127.0.0.1</text>
  <text x="450" y="858" class="body">后续：跨设备访问时，建议使用 HTTPS 或 WSS 保护数据</text>
</svg>
